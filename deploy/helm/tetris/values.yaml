# Środowisko: beta albo prod (nadpisywane przez values-<env>.yaml).
environment: beta

# Host ustawia skrypt deployu, np. beta.<IP>.sslip.io.
host: ""

image:
  repository: ""
  tag: ""

# Sesje gry żyją w pamięci procesu (ADR-0006), więc zawsze 1 replika.
replicas: 1

game:
  # Bufor wejścia (ADR-0006): domyślnie 150 ms, do rewizji po M6 na podstawie wahań opóźnienia.
  inputBufferMs: 150
  # Limit równoczesnych sesji, dopasowany do limitu pamięci poda.
  maxSessions: 200
  # Limit połączeń WebSocket z jednego IP; 0 = wyłączony. Wyłączony, bo Traefik w k3s
  # (externalTrafficPolicy: Cluster) widzi wszystkich klientów pod jednym adresem 10.42.0.1.
  maxConnectionsPerIp: 0

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 192Mi

# Postgres w namespace środowiska (ADR-0008); hasło generuje chart przy pierwszej instalacji.
postgres:
  image: postgres:17-alpine
  storage: 2Gi
  sharedBuffers: 32MB
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 192Mi

# Codzienny pg_dump do S3 (bucket z `bootstrap`, ustawiany przez skrypt deployu).
backup:
  enabled: true
  schedule: "0 3 * * *"
  bucket: ""
  region: eu-central-1
  awsCliImage: amazon/aws-cli:2.27.0
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# Secret z kluczem `users` (format htpasswd), tworzony ręcznie według runbooka (ADR-0003).
basicAuth:
  enabled: true
  secretName: basic-auth

# Limity całego namespace'u (ADR-0002), żeby beta nie zabrała zasobów produ.
quota:
  requestsCpu: 500m
  requestsMemory: 512Mi
  limitsMemory: 768Mi
  pods: 10
