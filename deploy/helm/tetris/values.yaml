# Środowisko: beta albo prod (nadpisywane przez values-<env>.yaml).
environment: beta

# Host ustawia skrypt deployu, np. beta.<IP>.sslip.io.
host: ""

image:
  repository: ""
  tag: ""

# Sesje gry żyją w pamięci procesu (ADR-0006), więc zawsze 1 replika.
replicas: 1

game:
  # Bufor wejścia (ADR-0006): domyślnie 150 ms, do rewizji po M6 na podstawie wahań opóźnienia.
  inputBufferMs: 150
  # Limit równoczesnych sesji, dopasowany do limitu pamięci poda.
  maxSessions: 200

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 192Mi

# Secret z kluczem `users` (format htpasswd), tworzony ręcznie według runbooka (ADR-0003).
basicAuth:
  enabled: true
  secretName: basic-auth

# Limity całego namespace'u (ADR-0002), żeby beta nie zabrała zasobów produ.
quota:
  requestsCpu: 500m
  requestsMemory: 512Mi
  limitsMemory: 768Mi
  pods: 10
