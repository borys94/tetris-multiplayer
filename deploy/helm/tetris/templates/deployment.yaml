apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "tetris.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "tetris.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tetris.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ required "image.repository jest wymagane" .Values.image.repository }}:{{ required "image.tag jest wymagane" .Values.image.tag }}"
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            # WebSocket /ws przyjmuje połączenia tylko ze strony gry (spec 004).
            - name: ALLOWED_ORIGIN
              value: {{ printf "https://%s" .Values.host | quote }}
            # IP klienta z X-Forwarded-For dopisywanego przez Traefika (limit połączeń na IP).
            - name: TRUST_PROXY
              value: "true"
            - name: INPUT_BUFFER_MS
              value: {{ .Values.game.inputBufferMs | quote }}
            - name: MAX_SESSIONS
              value: {{ .Values.game.maxSessions | quote }}
            - name: MAX_CONNECTIONS_PER_IP
              value: {{ .Values.game.maxConnectionsPerIp | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
