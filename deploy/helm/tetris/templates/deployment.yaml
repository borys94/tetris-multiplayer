apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "tetris.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  # Deploy bez przerywania meczów (spec 007): najpierw nowy pod, stary dogrywa mecze.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "tetris.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tetris.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      # Stary pod czeka po SIGTERM na koniec trwających meczów (DRAIN_TIMEOUT_MS jest krótszy).
      terminationGracePeriodSeconds: {{ .Values.drain.gracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ required "image.repository jest wymagane" .Values.image.repository }}:{{ required "image.tag jest wymagane" .Values.image.tag }}"
          ports:
            - name: http
              containerPort: 3000
            # Metryki Prometheusa (spec 006); Service i ingress tego portu nie wystawiają.
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          env:
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: APP_ENV
              value: {{ .Values.environment | quote }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            # Kubernetes podstawia $(POSTGRES_PASSWORD) zdefiniowane wyżej (hasło jest alfanumeryczne).
            - name: DATABASE_URL
              value: "postgres://blockfall:$(POSTGRES_PASSWORD)@postgres:5432/blockfall"
            # WebSocket /ws przyjmuje połączenia tylko ze strony gry (spec 004).
            - name: ALLOWED_ORIGIN
              value: {{ printf "https://%s" .Values.host | quote }}
            # IP klienta z X-Forwarded-For dopisywanego przez Traefika (limit połączeń na IP).
            - name: TRUST_PROXY
              value: "true"
            - name: INPUT_BUFFER_MS
              value: {{ .Values.game.inputBufferMs | quote }}
            - name: MAX_SESSIONS
              value: {{ .Values.game.maxSessions | quote }}
            - name: MAX_CONNECTIONS_PER_IP
              value: {{ .Values.game.maxConnectionsPerIp | quote }}
            - name: MAX_ROOMS
              value: {{ .Values.game.maxRooms | quote }}
            # 20 s zapasu na zamknięcie serwera przed SIGKILL.
            - name: DRAIN_TIMEOUT_MS
              value: {{ mul (sub .Values.drain.gracePeriodSeconds 20) 1000 | quote }}
          # Serwer zaczyna nasłuchiwać po migracjach, a przy pierwszym deployu czeka na Postgresa
          # (do ok. 2 min): do tego czasu liveness nie może go restartować.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # `/ready` zwraca 503, gdy pod dogrywa mecze przed zamknięciem; `/health` dalej 200.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
