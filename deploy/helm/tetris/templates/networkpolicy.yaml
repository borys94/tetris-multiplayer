# Ruch przychodzący tylko od Traefika (kube-system) i z tego samego namespace'u;
# beta i prod nie widzą się nawzajem (ADR-0002).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tetris-isolation
  labels:
    {{- include "tetris.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
