# Shared CI setup — see specs/005-ci-quality-gates/design.md D-005.
# Node from .nvmrc, Yarn from the repository (yarnPath), immutable install. No dependency cache (v1).
name: Setup
description: Node.js from .nvmrc, Yarn from yarnPath, yarn install --immutable

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        package-manager-cache: false

    # Node >= 25 ships without corepack; run the Yarn release committed in .yarn/releases.
    - name: Set up Yarn
      shell: bash
      run: |
        yarn_path="$(sed -n 's/^yarnPath: *//p' .yarnrc.yml)"
        mkdir -p "$RUNNER_TEMP/yarn-bin"
        printf '#!/usr/bin/env bash\nexec node "%s/%s" "$@"\n' "$GITHUB_WORKSPACE" "$yarn_path" > "$RUNNER_TEMP/yarn-bin/yarn"
        chmod +x "$RUNNER_TEMP/yarn-bin/yarn"
        echo "$RUNNER_TEMP/yarn-bin" >> "$GITHUB_PATH"

    - name: Verify toolchain versions
      shell: bash
      run: |
        expected_node="$(cat .nvmrc)"
        expected_yarn="$(node -p "require('./package.json').packageManager.split('@')[1]")"
        actual_node="$(node -p 'process.versions.node.split(".")[0]')"
        actual_yarn="$(yarn --version)"
        echo "node: $(node --version) (expected major $expected_node), yarn: $actual_yarn (expected $expected_yarn)"
        test "$actual_node" = "$expected_node"
        test "$actual_yarn" = "$expected_yarn"

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable
